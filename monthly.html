<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勤務者動態 月次集計</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans JP", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", sans-serif;
  }
</style>
</head>

<body>
  <h1>勤務者動態 月次集計</h1>
  <p>募集課勤務者 動態管理システム</p>

  <label for="monthSelect">表示月：</label>
  <input type="month" id="monthSelect">
  <button onclick="loadMonthly()">表示</button>

  <div id="summary"></div>

  <table>
  <thead>
    <tr id="monthlyHeader">
      <th>氏名</th>
      <th>月残業</th>
      <th>月外勤</th>
    </tr>
  </thead>
  <tbody id="monthlyBody"></tbody>
</table>

  <div id="message"></div>
<script>
  const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
  function toJstDate(date) {
  return new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date(date));
}
async function loadMonthly() {
  const month = document.getElementById("monthSelect").value;
// 選択した月の日数を取得
const [year, monthNumber] = month.split("-").map(Number);
const daysInMonth = new Date(year, monthNumber, 0).getDate();

// 横方向の日付見出しを作成
const header = document.getElementById("monthlyHeader");

header.innerHTML =
  "<th>氏名</th>" +
  "<th>月残業</th>" +
  "<th>月外勤</th>";

for (let day = 1; day <= daysInMonth; day++) {
  header.innerHTML += "<th>" + day + "日</th>";
}
  if (!month) {
    document.getElementById("message").textContent =
      "表示する月を選択してください";
    return;
    }
    const { data: members, error } = await client
    .from("members")
    .select("id,display_name,sort_order")
    .order("sort_order", { ascending: true });
const { data: logs, error: logsError } = await client
  .from("status_logs")
  .select("member_id,state,recorded_at")
  .order("recorded_at", { ascending: true });

if (logsError) {
  document.getElementById("message").textContent =
    "動態記録を取得できません：" + logsError.message;
  return;
}
  if (error) {
    document.getElementById("message").textContent =
      "勤務者一覧を取得できません：" + error.message;
    return;
  }
   const body = document.getElementById("monthlyBody");
  body.innerHTML = "";

  members.forEach(member => {

  const memberLogs = logs.filter(log =>
    Number(log.member_id) === Number(member.id) &&
    toJstDate(log.recorded_at).slice(0, 7).replace(/\//g, "-") === month
  );

  // この勤務者について、記録が存在する日を取得
  const days = [...new Set(
    memberLogs.map(log => toJstDate(log.recorded_at))
  )].sort();

  days.forEach(day => {

    const dayLogs = memberLogs.filter(log =>
      toJstDate(log.recorded_at) === day
    );

    const firstIn = dayLogs.find(log =>
      log.state === "出勤"
    );

    const lastOut = [...dayLogs].reverse().find(log =>
      log.state === "退勤"
    );

    const formatTime = (date) =>
      new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(date));

    const tr = document.createElement("tr");

    tr.innerHTML =
      "<td>" + member.display_name + "</td>" +
      "<td>" + day.slice(8, 10) + "日</td>" +
      "<td>" + (firstIn ? formatTime(firstIn.recorded_at) : "-") + "</td>" +
      "<td>" + (lastOut ? formatTime(lastOut.recorded_at) : "-") + "</td>";

    body.appendChild(tr);
  });

});
  }
  loadMonthly();
</script>
</body>
</html>
