<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勤務者動態 月次集計</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP",
                   "Yu Gothic", sans-serif;
      margin: 0;
      padding: 20px;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 20px;
    }

    p {
      font-size: 18px;
      margin-bottom: 28px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    input, button {
      font-size: 16px;
      padding: 7px 10px;
      border: 0;
      border-radius: 12px;
      background: #eee;
    }

    button {
      cursor: pointer;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 7px 8px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #f5f5f5;
      font-weight: bold;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: white;
      z-index: 1;
    }

    thead th:first-child {
      background: #f5f5f5;
      z-index: 2;
    }

    .summary {
      font-weight: bold;
    }

    .leave {
      font-size: 12px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      color: #b00020;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>勤務者動態 月次集計</h1>
  <p>募集課勤務者 動態管理システム</p>

  <div class="controls">
    <label for="monthSelect">表示月：</label>
    <input type="month" id="monthSelect">
    <button type="button" onclick="loadMonthly()">表示</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="monthlyHeader">
          <th>氏名</th>
          <th>月残業</th>
          <th>月外勤</th>
        </tr>
      </thead>

      <tbody id="monthlyBody"></tbody>
    </table>
  </div>

  <div id="message"></div>

<script>
const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

function jstParts(dateValue) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).formatToParts(new Date(dateValue));

  const get = type =>
    parts.find(p => p.type === type)?.value || "";

  return {
    year: get("year"),
    month: get("month"),
    day: get("day"),
    hour: get("hour"),
    minute: get("minute")
  };
}

function jstDate(dateValue) {
  const p = jstParts(dateValue);
  return p.year + "-" + p.month + "-" + p.day;
}

function jstTime(dateValue) {
  const p = jstParts(dateValue);
  return p.hour + ":" + p.minute;
}

function minuteOfDay(dateValue) {
  const p = jstParts(dateValue);
  return Number(p.hour) * 60 + Number(p.minute);
}

function formatMinutes(value) {
  const minutes = Math.max(0, Math.round(value || 0));
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;

  return h + ":" + String(m).padStart(2, "0");
}

function leaveText(state) {
  if (state === "休暇：1日") return "休暇 1日";
  if (state === "休暇：午前") return "午前休";
  if (state === "休暇：午後") return "午後休";

  if (state && state.startsWith("休暇：時間休")) {
    const range =
      state.replace("休暇：時間休", "").trim();

    return range ? "時休 " + range : "時間休";
  }

  return "";
}

async function loadMonthly() {

  const message =
    document.getElementById("message");

  const body =
    document.getElementById("monthlyBody");

  const header =
    document.getElementById("monthlyHeader");

  message.textContent = "";
  body.innerHTML = "";

  try {

    const selectedMonth =
      document.getElementById("monthSelect").value;

    if (!selectedMonth) {
      message.textContent =
        "表示する月を選択してください。";
      return;
    }

    const [year, monthNumber] =
      selectedMonth.split("-").map(Number);

    const daysInMonth =
      new Date(year, monthNumber, 0).getDate();

    /* 日付見出しを作成 */

    header.innerHTML =
      "<th>氏名</th>" +
      "<th>月残業</th>" +
      "<th>月外勤</th>";

    for (let day = 1; day <= daysInMonth; day++) {
      header.innerHTML +=
        "<th>" + day + "日</th>";
    }

    /* 勤務者取得 */

    const {
      data: members,
      error: membersError
    } = await client
      .from("members")
      .select("id,display_name,sort_order")
      .order("sort_order", { ascending: true });

    if (membersError) {
      throw new Error(
        "勤務者一覧取得エラー：" +
        membersError.message
      );
    }

    if (!members) {
      throw new Error(
        "勤務者一覧を取得できませんでした。"
      );
    }

    /* 動態ログ取得 */

    const {
      data: logs,
      error: logsError
    } = await client
      .from("status_logs")
      .select("member_id,state,recorded_at")
      .order("recorded_at", { ascending: true });

    if (logsError) {
      throw new Error(
        "動態記録取得エラー：" +
        logsError.message
      );
    }

    const safeLogs = logs || [];

    /* 39名を順番に作成 */

    members.forEach(member => {

      const tr =
        document.createElement("tr");

      const memberLogs =
        safeLogs.filter(log =>
          String(log.member_id) === String(member.id) &&
          jstDate(log.recorded_at).slice(0, 7) ===
            selectedMonth
        );

      let overtimeMinutes = 0;
      let outsideMinutes = 0;

      let row =
        "<td>" + member.display_name + "</td>" +
        '<td class="summary overtime"></td>' +
        '<td class="summary outside"></td>';

      /* 1日ずつ集計 */

      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const dateString =
          selectedMonth + "-" +
          String(day).padStart(2, "0");

        const dayLogs =
          memberLogs.filter(log =>
            jstDate(log.recorded_at) ===
              dateString
          );

        const firstIn =
          dayLogs.find(log =>
            log.state === "出勤"
          );

        const lastOut =
          [...dayLogs].reverse().find(log =>
            log.state === "退勤"
          );

        /* 残業 */

        if (firstIn) {
          const inMinutes =
            minuteOfDay(firstIn.recorded_at);

          if (inMinutes < 8 * 60 + 30) {
            overtimeMinutes +=
              (8 * 60 + 30) - inMinutes;
          }
        }

        if (lastOut) {
          const outMinutes =
            minuteOfDay(lastOut.recorded_at);

          if (outMinutes > 17 * 60 + 15) {
            overtimeMinutes +=
              outMinutes - (17 * 60 + 15);
          }
        }

        /* 外出・出張～帰庁 */

        let outsideStart = null;

        dayLogs.forEach(log => {

          if (
            (log.state === "外出" ||
             log.state === "出張") &&
            outsideStart === null
          ) {
            outsideStart =
              new Date(log.recorded_at);
          }

          if (
            log.state === "帰庁" &&
            outsideStart !== null
          ) {
            outsideMinutes +=
              (
                new Date(log.recorded_at) -
                outsideStart
              ) / 60000;

            outsideStart = null;
          }
        });

        /* 日別表示 */

        const contents = [];

        if (firstIn || lastOut) {
          contents.push(
            (firstIn
              ? jstTime(firstIn.recorded_at)
              : "—") +
            "<br>" +
            (lastOut
              ? jstTime(lastOut.recorded_at)
              : "—")
          );
        }

        dayLogs
          .filter(log =>
            log.state &&
            log.state.startsWith("休暇：")
          )
          .forEach(log => {

            const text =
              leaveText(log.state);

            if (text) {
              contents.push(
                '<span class="leave">' +
                text +
                "</span>"
              );
            }
          });

        const cell =
          contents.length
            ? contents.join("<br>")
            : "—";

        row +=
          "<td>" + cell + "</td>";
      }

      tr.innerHTML = row;

      tr.querySelector(".overtime")
        .textContent =
        formatMinutes(overtimeMinutes);

      tr.querySelector(".outside")
        .textContent =
        formatMinutes(outsideMinutes);

      body.appendChild(tr);
    });

    message.style.color = "#333";
    message.textContent =
      "勤務者 " +
      members.length +
      "名を表示";

  } catch (e) {

    console.error(e);

    message.style.color = "#b00020";
    message.textContent =
      "月次集計エラー：" +
      (e?.message || String(e));
  }
}

/* 最初に今月を設定 */

const now = new Date();

document.getElementById("monthSelect").value =
  now.getFullYear() +
  "-" +
  String(now.getMonth() + 1)
    .padStart(2, "0");

/* 初回表示 */

loadMonthly();

</script>
</body>
</html>
