<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勤務者動態 月次集計</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans JP", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", sans-serif;
  }
  }

/* 月次表 */
table {
  border-collapse: collapse;
  white-space: nowrap;
  width: max-content;
}

th, td {
  padding: 6px 10px;
  text-align: center;
  vertical-align: middle;
  box-sizing: border-box;
}

th:first-child,
td:first-child {
  min-width: 120px;
  text-align: left;
}

th:nth-child(2),
td:nth-child(2),
th:nth-child(3),
td:nth-child(3) {
  min-width: 70px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
/* 左3列の幅を固定 */
th:nth-child(1),
td:nth-child(1) {
  width: 105px;
  min-width: 105px;
  max-width: 105px;
}

th:nth-child(2),
td:nth-child(2) {
  width: 55px;
  min-width: 55px;
  max-width: 55px;
}

th:nth-child(3),
td:nth-child(3) {
  width: 55px;
  min-width: 55px;
  max-width: 55px;
}
/* 左3列を横スクロール時に固定 */
th:nth-child(1),
td:nth-child(1) {
  position: sticky;
  left: 0;
  z-index: 3;
  background: white;
}

th:nth-child(2),
td:nth-child(2) {
  position: sticky;
  left: 105px;
  z-index: 3;
  background: white;
}

th:nth-child(3),
td:nth-child(3) {
  position: sticky;
  left: 160px;
  z-index: 3;
  background: white;
}
  /* 固定3列の左右余白を縮小 */
th:nth-child(-n+3),
td:nth-child(-n+3) {
  padding-left: 4px;
  padding-right: 4px;
}
</style>
</head>

<body>
  <h1>勤務者動態 月次集計</h1>
  <p>募集課勤務者 動態管理システム</p>

  <label for="monthSelect">表示月：</label>
  <input type="month" id="monthSelect">
  <button onclick="loadMonthly()">表示</button>

  <div class="table-wrap">
  <table>
    <thead>
      <tr id="monthlyHeader">
        <th>氏名</th>
        <th>月残業</th>
        <th>月外勤</th>
      </tr>
    </thead>
    <tbody id="monthlyBody"></tbody>
  </table>
</div>

  <div id="message"></div>
<script>
  const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
  function toJstDate(date) {
  return new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date(date));
}
async function loadMonthly() {
  const month = document.getElementById("monthSelect").value;
// 選択した月の日数を取得
const [year, monthNumber] = month.split("-").map(Number);
const daysInMonth = new Date(year, monthNumber, 0).getDate();

// 横方向の日付見出しを作成
const header = document.getElementById("monthlyHeader");

header.innerHTML =
  "<th>氏名</th>" +
  "<th>月残業</th>" +
  "<th>月外勤</th>";

for (let day = 1; day <= daysInMonth; day++) {
  header.innerHTML += "<th>" + day + "日</th>";
}
  if (!month) {
    document.getElementById("message").textContent =
      "表示する月を選択してください";
    return;
    }
    const { data: members, error } = await client
    .from("members")
    .select("id,display_name,sort_order")
    .order("sort_order", { ascending: true });
const { data: logs, error: logsError } = await client
  .from("status_logs")
  .select("member_id,state,recorded_at")
  .order("recorded_at", { ascending: true });

if (logsError) {
  document.getElementById("message").textContent =
    "動態記録を取得できません：" + logsError.message;
  return;
}
  if (error) {
    document.getElementById("message").textContent =
      "勤務者一覧を取得できません：" + error.message;
    return;
  }
   const body = document.getElementById("monthlyBody");
  body.innerHTML = "";

  members.forEach(member => {

  const memberLogs = logs.filter(log =>
    Number(log.member_id) === Number(member.id) &&
    toJstDate(log.recorded_at).slice(0, 7).replace(/\//g, "-") === month
  );

  const formatTime = (date) =>
    new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(new Date(date));

  const minutesFromTime = (date) => {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Tokyo",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).formatToParts(new Date(date));

    const hour = Number(parts.find(p => p.type === "hour").value);
    const minute = Number(parts.find(p => p.type === "minute").value);

    return hour * 60 + minute;
  };

  let overtimeMinutes = 0;
  let outsideMinutes = 0;

  const tr = document.createElement("tr");

  let row =
    "<td>" + member.display_name + "</td>" +
    '<td class="overtime"></td>' +
    '<td class="outside"></td>';

  for (let day = 1; day <= daysInMonth; day++) {

    const dayString =
      month + "-" + String(day).padStart(2, "0");

    const dayLogs = memberLogs.filter(log =>
      toJstDate(log.recorded_at).replace(/\//g, "-") === dayString
    );

    const firstIn = dayLogs.find(log =>
      log.state === "出勤"
    );

    const lastOut = [...dayLogs].reverse().find(log =>
      log.state === "退勤"
    );

    if (firstIn) {
      const inMinutes = minutesFromTime(firstIn.recorded_at);

      if (inMinutes < 8 * 60 + 30) {
        overtimeMinutes +=
          (8 * 60 + 30) - inMinutes;
      }
    }

    if (lastOut) {
      const outMinutes = minutesFromTime(lastOut.recorded_at);

      if (outMinutes > 17 * 60 + 15) {
        overtimeMinutes +=
          outMinutes - (17 * 60 + 15);
      }
    }

    let outsideStart = null;

    dayLogs.forEach(log => {
      if (
        (log.state === "外出" ||
         log.state === "出張") &&
        outsideStart === null
      ) {
        outsideStart = new Date(log.recorded_at);
      }

      if (
        log.state === "帰庁" &&
        outsideStart !== null
      ) {
        outsideMinutes +=
          (new Date(log.recorded_at) - outsideStart) / 60000;

        outsideStart = null;
      }
    });

    let cell = "－";

// 当日の休暇記録を取得
const leaveLogs = dayLogs.filter(log =>
  log.state && log.state.startsWith("休暇：")
);

// 出勤・退勤を表示
if (firstIn || lastOut) {
  cell =
    (firstIn ? formatTime(firstIn.recorded_at) : "－") +
    "<br>" +
    (lastOut ? formatTime(lastOut.recorded_at) : "－");
}

// 休暇を追加表示
leaveLogs.forEach(log => {

  if (log.state === "休暇：1日") {
    cell += (cell === "－" ? "" : "<br>") + "休暇 1日";
  }

  else if (log.state === "休暇：午前") {
    cell += (cell === "－" ? "" : "<br>") + "午前休";
  }

  else if (log.state === "休暇：午後") {
    cell += (cell === "－" ? "" : "<br>") + "午後休";
  }

  else if (log.state.startsWith("休暇：時間休")) {
    const timeRange = log.state.replace("休暇：時間休", "").trim();
    cell +=
      (cell === "－" ? "" : "<br>") +
      "時休 " + timeRange;
  }

});

row += "<td>" + cell + "</td>"; }

  const formatMinutes = (minutes) => {
    const h = Math.floor(minutes / 60);
    const m = Math.round(minutes % 60);
    return h + ":" + String(m).padStart(2, "0");
  };

  tr.innerHTML = row;

  tr.querySelector(".overtime").textContent =
    formatMinutes(overtimeMinutes);

  tr.querySelector(".outside").textContent =
    formatMinutes(outsideMinutes);

  body.appendChild(tr);
});
  }
  loadMonthly();
</script>
</body>
</html>
